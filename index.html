<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ERIC Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<title>ERIC DASHBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#171A1F; --ink-2:#434955; --muted:#6F7683;
  --line:#DCDFE4; --line-2:#E9EBEF; --primary:#171A1F; --on-primary:#FFFFFF;
  --danger:#C23A2F; --warn:#A86F12; --ok:#1E8455;
  --c-photo:#C2830A; --c-design:#C2357A; --c-finance:#1E8C5E; --c-run:#2563D9; --c-video:#7C4DDB; --c-personal:#5A6A7E; --c-gcal:#8A94A3;
  --shadow:0 14px 40px rgba(16,22,32,.16);
  --side-w:248px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#1A1D22; --surface-2:#22262C; --ink:#E8EBEF; --ink-2:#B7BDC6; --muted:#8A919C;
    --line:#2D3239; --line-2:#252A30; --primary:#E8EBEF; --on-primary:#111317;
    --danger:#F0776B; --warn:#E0A84A; --ok:#4CC08A;
    --c-photo:#E4A93A; --c-design:#E8659F; --c-finance:#43B784; --c-run:#5E90F0; --c-video:#A381F2; --c-personal:#94A3B6; --c-gcal:#8E98A6;
    --shadow:0 14px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D22; --surface-2:#22262C; --ink:#E8EBEF; --ink-2:#B7BDC6; --muted:#8A919C;
  --line:#2D3239; --line-2:#252A30; --primary:#E8EBEF; --on-primary:#111317;
  --danger:#F0776B; --warn:#E0A84A; --ok:#4CC08A;
  --c-photo:#E4A93A; --c-design:#E8659F; --c-finance:#43B784; --c-run:#5E90F0; --c-video:#A381F2; --c-personal:#94A3B6; --c-gcal:#8E98A6;
  --shadow:0 14px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--c-run);outline-offset:2px}
#view:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:50;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand-mark i{width:7px;height:7px;border-radius:1.5px;display:block}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:12px;color:var(--muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav a .sw{margin-left:auto}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.sw{width:10px;height:10px;border-radius:2.5px;display:inline-block;flex:none}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.main{margin-left:var(--side-w);min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.search{position:relative;flex:1;max-width:520px}
.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input[type=search]{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 12px 0 36px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.menu-btn{display:none}
#view{padding:8px 28px 96px;max-width:1440px}
.scrim{display:none}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn .i{width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=search],input[type=url],input[type=password],select,textarea{width:100%;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
textarea{resize:vertical;min-height:70px}
select{appearance:auto}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;margin:0;flex:none}
input[type=range]{width:100%;accent-color:var(--c-design)}

/* Page header */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:14px 0 20px}
.ph h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:12px}
.ph h1 .sw{width:14px;height:14px;border-radius:3px}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:20px;overflow:hidden}
.stat{padding:14px 18px;border-right:1px solid var(--line-2)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat b.neg{color:var(--danger)} .stat b.pos{color:var(--ok)}

/* Cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.span-5{grid-column:span 5}.span-7{grid-column:span 7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:600;margin:0}
.card-h .more{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none}
.card-h .more:hover{color:var(--ink)}
.card-h .acts{margin-left:auto;display:flex;gap:6px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.empty .btn{margin-top:8px}
.section{margin-top:28px}
.section > h2{font-size:17px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.section > h2 .acts{margin-left:auto;display:flex;gap:6px}

/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover .t{text-decoration:underline;text-underline-offset:3px}
.row .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow{flex:1;min-width:0}
.row .r{margin-left:auto;text-align:right;font-size:13.5px;white-space:nowrap}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.when.late{color:var(--danger);font-weight:600}
.when.soon{color:var(--warn);font-weight:600}
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.15;background:var(--surface-2)}
.datebox b{display:block;font-size:17px}
.datebox span{font-size:11px;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line-2)}
.chip.cat{background:color-mix(in srgb,var(--cc) 13%,transparent);color:color-mix(in srgb,var(--cc) 78%,var(--ink));border-color:color-mix(in srgb,var(--cc) 28%,transparent)}
.chip.high{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.chip.medium{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.chip.low{color:var(--muted)}
.chip.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.chip.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:3px;background:var(--cc,var(--ink-2))}
.bar.over > i{background:var(--danger)}

/* Today band (dashboard hero) */
.hero{margin:10px 0 22px}
.hero-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.hero .date{color:var(--muted);font-size:15px}
.band{position:relative;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 10px}
.band-track{position:relative;min-height:64px;margin:0 0 4px}
.band-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-2)}
.band-tick span{position:absolute;bottom:-20px;left:-22px;width:44px;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}
.band-now{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--danger);z-index:2}
.band-now::before{content:"";position:absolute;top:-4px;left:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.blk{position:absolute;height:28px;border-radius:6px;padding:0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;border:0;text-align:left;background:color-mix(in srgb,var(--cc) 20%,var(--surface));color:color-mix(in srgb,var(--cc) 70%,var(--ink));box-shadow:inset 3px 0 0 var(--cc)}
.blk:hover{background:color-mix(in srgb,var(--cc) 30%,var(--surface))}
.band-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 0 24px;margin:-6px 0 0}
.band-track{margin:0 20px!important}
.band-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center;font-size:13px;color:var(--muted)}
.band-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

/* Agenda */
.agenda-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2);cursor:pointer}
.agenda-item:first-child{border-top:0}
.agenda-item .tm{width:52px;flex:none;font-size:13px;color:var(--muted);padding-top:1px}
.agenda-item .ln{width:3px;align-self:stretch;border-radius:2px;background:var(--cc);flex:none}

/* Charts */
.bchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:stretch;height:100%;min-width:0}
.bcol .bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.bcol .bars i{display:block;flex:1;max-width:26px;border-radius:4px 4px 0 0;min-height:2px}
.bcol .bars i.plan{background:transparent!important;border:1.5px dashed var(--c-run);border-bottom:0}
.bcol > span{font-size:11.5px;color:var(--muted);text-align:center;padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcol.cur > span{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lchart{position:relative;height:140px}
.lchart svg{width:100%;height:100%;overflow:visible}
.lchart-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .bar{height:8px}

/* Week strip (running) */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:1px solid var(--line-2);border-radius:8px;padding:7px 6px;min-height:78px;font-size:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.wd.today{border-color:var(--c-run)}
.wd .d{color:var(--muted);font-weight:500}
.wd .km{font-weight:600;font-size:13px}
.wd .pl{border:1.5px dashed var(--c-run);border-radius:5px;padding:2px 4px;color:var(--c-run);cursor:pointer;background:none;font-size:11.5px;text-align:left}
.wd .dn{background:var(--c-run);color:#fff;border-radius:5px;padding:2px 4px;font-size:11.5px;cursor:pointer;border:0;text-align:left}

/* Filter bar */
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fbar input[type=search]{max-width:260px}
.fbar select{width:auto;min-width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:34px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.seg button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

/* Table-like list */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl .row{padding:11px 16px}
.tbl .row:hover{background:var(--surface-2)}
.tbl-scroll{overflow-x:auto}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:2px 4px 10px}
.col-h span{color:var(--muted);font-weight:500}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tile:hover{border-color:var(--muted)}
.tile .t{font-weight:600;margin:6px 0 2px;line-height:1.3}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile .foot{display:flex;align-items:center;gap:8px;margin-top:8px}
.tile select{min-height:28px;padding:2px 6px;font-size:12.5px;width:auto;max-width:150px;min-width:0;flex:0 1 150px;margin-left:auto}

/* Project cards (photo/video) */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--cc)}
.pcard:hover{border-color:var(--muted);border-top-color:var(--cc)}
.pcard .t{font-weight:600;font-size:15.5px;line-height:1.3}
.pcard .meta{font-size:13px;color:var(--muted)}
.pcard .kv{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.pcard .kv span{color:var(--muted)}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:2px;background:var(--line-2)}
.steps i.on{background:var(--cc)}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cal-h span{padding:8px 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:112px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;background:none;text-align:left;border-top:0;border-left:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--surface-2)}
.cell.out .n{color:var(--muted)}
.cell .n{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .n{background:var(--primary);color:var(--on-primary)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--c-run)}
.ev{display:block;font-size:11.5px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--cc) 15%,transparent);color:color-mix(in srgb,var(--cc) 75%,var(--ink));border-left:2.5px solid var(--cc)}
.ev.done{text-decoration:line-through;opacity:.6}
.ev-more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cc)}
.legend-t{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.legend-t button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer}
.legend-t button.off{opacity:.45}
.legend-t button.off .sw{background:transparent!important;border:1.5px solid var(--muted)}

/* Popovers */
.pop{position:absolute;top:46px;right:0;width:360px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:8px}
.pop h3{font-size:13px;color:var(--muted);font-weight:500;margin:6px 8px 4px}
.pop .pi{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop .pi:hover{background:var(--surface-2)}
.pop .pi .sw{margin-top:6px}
.pop .pi small{display:block;color:var(--muted);font-size:12.5px}
.pop .x{margin-left:auto;color:var(--muted);border:0;background:none;cursor:pointer;padding:2px;border-radius:5px}
.search .pop{left:0;right:auto;width:100%;top:44px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.qgrid button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;font-size:14px}
.qgrid button:hover{background:var(--surface-2)}

/* Modal */
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(10,12,16,.45)}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:18px;margin:0;font-weight:650}
.m-h .icon-btn{margin-left:auto;border:0;background:none}
.m-b{padding:16px 20px;overflow:auto;max-height:calc(100dvh - 180px)}
.m-f{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.m-f .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld > label,.fld > .lab{font-size:13px;font-weight:500;color:var(--ink-2)}
.fld .hint{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;min-height:38px}
.clist{border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.clist ul{list-style:none;margin:0;padding:0}
.clist li{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.clist li label{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer}
.clist li.dn span{text-decoration:line-through;color:var(--muted)}
.clist li .rm{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;display:grid}
.clist li .rm:hover{color:var(--danger)}
.clist li small{color:var(--muted);font-size:12px;white-space:nowrap}
.cl-add{display:flex;gap:6px;padding:8px 0 4px;flex-wrap:wrap}
.cl-add input{flex:1;min-width:140px}
.cl-empty{font-size:13px;color:var(--muted);padding:6px 0}
.pay-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pay-row input{width:auto;flex:1;min-width:110px}

/* Toast */
#toast{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:100;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:12px;align-items:center}
#toast button{background:none;border:0;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}

.fab-wrap{position:fixed;right:0;bottom:0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:45;pointer-events:none;display:none}
.fab{pointer-events:auto;width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--on-primary);border:0;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.fab .i{width:24px;height:24px}

.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pr div{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.pr b{display:block;font-size:18px}
.pr span{font-size:12.5px;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line-2)}
.goal:first-child{border-top:0}
.goal .gh{display:flex;align-items:center;gap:8px}
.goal .gh .t{font-weight:600;flex:1;min-width:0;cursor:pointer}
.goal .gs{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.mini{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.welcome h2{margin:0 0 4px;font-size:18px}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kvs span{color:var(--muted)}
.pref{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line-2);align-items:start}
.pref:first-of-type{border-top:0}
.pref h3{margin:0;font-size:14.5px;font-weight:600}
.pref p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.pref .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pref .ctl input,.pref .ctl select{max-width:280px}
.status-msg{font-size:13px;margin-top:6px}
.status-msg.err{color:var(--danger)}

/* GitHub/PWA: private cloud account gate */
.auth-overlay{position:fixed;z-index:200;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.auth-overlay[hidden]{display:none!important}
.auth-panel{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.auth-panel h1{margin:0 0 6px;font-size:25px;letter-spacing:-.02em}
.auth-panel p{margin:0 0 18px;color:var(--muted);font-size:14px}
.auth-panel form{display:grid;gap:12px}
.auth-panel form .btn{width:100%;justify-content:center;height:42px}
.auth-panel .fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.auth-panel .auth-err{font-size:13px;color:var(--danger);min-height:20px;margin:8px 0 0}
/* Responsive */
@media (max-width:1180px){
  .span-4{grid-column:span 6}.span-8,.span-7,.span-5{grid-column:span 12}
  .cal-wrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  :root{--side-w:0px}
  .side{width:280px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:49}
  .menu-btn{display:inline-grid}
  .top{padding:10px 16px}
  #view{padding:4px 16px 110px}
  .top .btn.primary{display:none}
  .fab-wrap{display:block}
  .span-4,.span-6{grid-column:span 12}
}
@media (max-width:640px){
  .hero h1{font-size:27px}
  .ph h1{font-size:24px}
  .fgrid{grid-template-columns:1fr}
  .cell{min-height:58px;padding:4px}
  .cell .ev,.cell .ev-more{display:none}
  .cell .dots{display:flex}
  .cal-h span{padding:6px 4px;text-align:center}
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .wd{padding:5px 3px;min-height:70px;font-size:11px}
  .wd .pl,.wd .dn{font-size:10.5px;padding:1px 3px}
  .pref{grid-template-columns:1fr;gap:8px}
  .search input{font-size:16px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2n){border-right:0}
  .stat{border-bottom:1px solid var(--line-2)}
  .hbar{grid-template-columns:90px 1fr auto}
  .band{padding:10px 8px 8px}
  .band-track{min-width:620px}
  .band-tick span{font-size:10px}
  .blk{font-size:11px;padding:0 5px}
  .plist{grid-template-columns:1fr}
}
.nstep{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:500}
.nstep span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .i{width:14px;height:14px}
.clist li .rm[disabled],.fe-row .rm[disabled]{opacity:.3;cursor:default}
.fe-head,.fe-row{display:grid;grid-template-columns:18px 1fr 160px 64px 28px 28px;gap:8px;align-items:center}
.fe-head{font-size:12px;color:var(--muted);margin:14px 0 4px}
.fe-row{padding:4px 0}
.fe-row .rm{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;height:30px;border-radius:6px}
.fe-row .rm:hover{color:var(--ink)}
@media (max-width:640px){.clist .stg{display:none}.fe-head{display:none}.fe-row{grid-template-columns:18px 1fr 64px 28px 28px;border-bottom:1px solid var(--line-2);padding:8px 0}.fe-row select{grid-column:2/-1;grid-row:2}}
.hb-row{gap:10px}
.hb-emoji{font-size:20px;width:28px;text-align:center;flex:none}
.hb-check{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none}
.hb-check:hover{border-color:var(--ok)}
.hb-check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hb-check .i{width:18px;height:18px}
.hb-count{display:inline-flex;align-items:center;gap:6px}
.hb-count b{min-width:38px;text-align:center;font-size:14px}.hb-count b.ok{color:var(--ok)}
.hb-week{display:flex;gap:4px}
.hb-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;font-size:10.5px;color:var(--muted);display:grid;place-items:center;padding:0}
.hb-dot.on{background:var(--c-personal);border-color:var(--c-personal);color:#fff}
.hb-dot.part{border-color:var(--c-personal)}
.hb-dot.off{border-style:dashed;opacity:.5}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:2px}
.heat i{border-radius:3px;background:var(--line-2)}
.heat i.on{background:var(--c-personal)}.heat i.part{background:color-mix(in srgb,var(--c-personal) 45%,var(--line-2))}.heat i.off{background:transparent;border:1px dashed var(--line-2)}.heat i.fut{background:transparent}
.it-head,.it-row{display:grid;grid-template-columns:1fr 70px 110px 28px;gap:8px;align-items:center}
.it-head{font-size:12px;color:var(--muted);margin-bottom:4px}
.it-row{padding:3px 0}
.it-row .rm{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;height:30px}
.inv-wrap{background:#fff;color:#16181d;border:1px solid var(--line);border-radius:10px;padding:22px;overflow-x:auto}
.inv{font-size:13.5px;line-height:1.5;color:#16181d;min-width:420px}
.inv-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.inv-biz{font-size:18px;font-weight:700}
.inv-title{font-size:22px;font-weight:700;letter-spacing:.06em}
.inv-small{font-size:12px;color:#5a606b}
.inv-to{margin-bottom:18px}
.inv-tbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.inv-tbl th{text-align:left;font-size:12px;color:#5a606b;border-bottom:1.5px solid #16181d;padding:6px 4px}
.inv-tbl td{border-bottom:1px solid #e3e5e9;padding:8px 4px;vertical-align:top}
.inv-tbl th:not(:first-child),.inv-tbl td:not(:first-child){text-align:right;white-space:nowrap}
.inv-sum{margin-left:auto;max-width:260px}
.inv-sum div{display:flex;justify-content:space-between;padding:3px 0}
.inv-total{font-weight:700;font-size:15px;border-top:1px solid #16181d;margin-top:4px;padding-top:6px!important}
.inv-note{margin-top:16px;font-size:12.5px}
#printArea{display:none}
body.hide-design [data-sec="design"]{display:none!important}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important}body.printing{background:#fff}body.printing::before{display:none}@page{margin:16mm}}
@media (max-width:640px){.hb-week{display:none}.it-head{display:none}.it-row{grid-template-columns:1fr 56px 88px 28px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

async function initStore() {

    if (!firebase.apps.length) firebase.initializeApp(cfg);

const billKey = (b, d) => b.freq === 'yearly' ? d.slice(0, 4) : b.freq === 'once' ? 'once' : d.slice(0, 7);
function billOccurrences(from, to) {
  const out = [];
  const occ = (b, d) => { const key = billKey(b, d); out.push({ bill: b, date: d, key, paid: !!(b.paid && b.paid[key]) }); };
  for (const b of byKind('bill')) {
    const f = b.freq || 'monthly';
    if (f === 'once') { if (b.date && b.date >= from && b.date <= to) occ(b, b.date); continue; }
    if (f === 'yearly') {
      if (!b.date) continue;
      const md = b.date.slice(5);
      for (let y = +from.slice(0, 4); y <= +to.slice(0, 4); y++) { const d = `${y}-${md}`; if (d >= from && d <= to && d >= b.date.slice(0, 4) + '-01-01') occ(b, d); }
      continue;
    }
    let y = +from.slice(0, 4), m = +from.slice(5, 7);
    const ey = +to.slice(0, 4), em = +to.slice(5, 7);
    while (y < ey || (y === ey && m <= em)) {
      const dim = new Date(y, m, 0).getDate();
      const d = `${y}-${pad(m)}-${pad(Math.min(Math.max(1, Math.round(num(b.day) || 1)), dim))}`;
      if (d >= from && d <= to && (!b.since || d >= b.since)) occ(b, d);
      m++; if (m > 12) { m = 1; y++; }
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function toggleBillPaid(id, key) {
  const src = get(id); if (!src) return;
  const b = clone(src); b.paid = b.paid || {};

    delete b.paid[key];
    const tx = byKind('tx').find(t => t.linkBill === link);
    if (tx) removeItem(tx.id);
    toast(`${b.name} marked unpaid`);
  } else {
    b.paid[key] = today();
    upsert({ id: uid(), kind: 'tx', type: 'expense', amount: num(b.amount), date: today(), source: 'personal', category: b.category || 'Bills', note: b.name, linkBill: link }, true);
    toast(`${b.name} paid, expense recorded`);
  }

}

function calEntries(from, to) {
  const out = [];

function generatePlan({ dist, raceDate, perWeek, longNow }) {
  dist = num(dist); perWeek = Math.round(num(perWeek)) || 4;
  const t = today();
  const raceMon = startOfWeek(raceDate);
  let weeks = Math.floor(daysBetween(startOfWeek(t), raceMon) / 7);
  if (weeks < 1) return null;
  weeks = Math.min(weeks, 24);
  const firstMon = addDays(raceMon, -7 * weeks);
  const peak = PLAN_PEAK[dist] || dist;
  const start = Math.min(peak, Math.max(3, num(longNow) || peak * 0.45));
  const taper = dist >= 21 ? 2 : 1;
  const build = Math.max(1, weeks - taper);
  const r = n => Math.max(2, Math.round(n * 2) / 2);
  const sessions = [];
  const add = (date, type, km) => { if (date >= t && date < raceDate) sessions.push({ id: uid(), date, type, distance: r(km), done: false }); };
  for (let w = 0; w < weeks; w++) {
    const mon = addDays(firstMon, 7 * w);
    let long;
    if (w < build) { const p = build === 1 ? 1 : w / (build - 1); long = start + (peak - start) * p; if ((w + 1) % 4 === 0 && w !== build - 1) long *= 0.8; }
    else long = peak * (w - build === 0 ? 0.7 : 0.55);

}

        <div class="chips"><span class="chip cat" style="--cc:var(--c-design)">${esc(d.type || 'Design')}</span>${k !== 'done' ? `<span class="chip ${d.priority || 'medium'}">${esc(lbl(OPT.priority, d.priority || 'medium'))}</span>` : ''}</div>
        <div class="t">${esc(d.title)}</div>
        ${d.factory ? `<div class="s">${esc(d.factory)}</div>` : ''}

    <section class="card span-5"><div class="card-h"><h2>Professional development</h2><div class="acts">${addBtn('goal', 'Goal', { cat: 'design' }, 'btn sm')}</div></div>

}

/* ============ Views: Video ============ */
function viewVideo() {
  const f = V.f.video, t = today(), yr = t.slice(0, 4);
  let list = byKind('video').filter(v => match(f.q, v.title, v.client, v.type, v.requirements, v.notes));
  if (f.status === 'active') list = list.filter(v => v.status !== 'delivered');
  else if (f.status) list = list.filter(v => v.status === f.status);
  if (f.type) list = list.filter(v => v.type === f.type);
  const sorters = { due: (a, b) => (a.due || '9999').localeCompare(b.due || '9999'), fee: (a, b) => num(b.fee) - num(a.fee), client: (a, b) => (a.client || a.title).localeCompare(b.client || b.title), recent: (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0) };
  list.sort(sorters[f.sort] || sorters.due);
  const vids = byKind('video');
  const balance = sum(vids, v => Math.max(0, num(v.fee) - projectPaid(v.id)));
  const vTx = byKind('tx').filter(x => x.source === 'video' && x.date && x.date.startsWith(yr)).sort((a, b) => b.date.localeCompare(a.date));
  const earned = sum(vTx.filter(x => x.type === 'income'), x => num(x.amount));
  const openRev = sum(vids, v => (v.revisions || []).filter(r => !r.done).length);
  return `
  <div class="ph"><div><h1>${sw('video')}Video editing</h1><p>Client projects, footage, revisions and deliverables.</p></div>
    <div class="acts"><button class="btn" data-act="flowEdit" data-kind="video">${icon('tasks')}Workflow steps</button>${addBtn('video', 'New project', null, 'btn primary')}</div></div>
  ${statsHtml([
    [vids.filter(v => v.status !== 'delivered').length, 'Active projects'],
    [openRev, 'Open revision requests', openRev ? 'neg' : ''],
    [vids.filter(v => v.status !== 'delivered' && v.due && v.due <= addDays(t, 7)).length, 'Due within 7 days'],
    [money(balance, true), 'Unpaid client balance', balance > 0 ? 'neg' : ''],
    [money(earned, true), `Earned in ${yr}`, 'pos'],
  ])}
  ${filterBar('video', [
    { k: 'q', search: true, ph: 'Filter projects' },
    { k: 'status', label: 'Status', opts: [['active', 'Active'], ['', 'All statuses'], ...OPT.videoStatus] },
    { k: 'type', label: 'Type', opts: [['', 'All types'], ...optList(OPT.videoType)] },
    { k: 'sort', label: 'Sort', opts: [['due', 'Deadline, soonest'], ['recent', 'Recently updated'], ['fee', 'Fee, highest'], ['client', 'Client name']] },
  ])}
  ${list.length ? `<div class="plist">${list.map(v => {
    const i = OPT.videoStatus.findIndex(o => o[0] === v.status), paid = projectPaid(v.id), fee = num(v.fee);
    const rev = v.revisions || [];
    return `<article class="pcard" style="--cc:var(--c-video)" data-act="edit" data-id="${v.id}">
      <div class="chips"><span class="chip">${esc(v.type || 'Video')}</span><span class="chip ${v.status === 'delivered' ? 'good' : ''}">${esc(lbl(OPT.videoStatus, v.status))}</span></div>
      <div class="t">${esc(v.title)}</div>
      <div class="steps" aria-label="Stage ${i + 1} of ${OPT.videoStatus.length}">${OPT.videoStatus.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="meta">${esc(v.client || 'No client set')}</div>
      ${nextStepHtml(v)}
      ${v.due ? `<div class="kv"><span>Deadline</span>${dueTag(v.due, v.status === 'delivered')}</div>` : ''}
      <div class="kv"><span>Deliverables</span>${clProg(v.deliverables)}</div>
      <div class="kv"><span>Revisions open</span>${rev.filter(r => !r.done).length} of ${rev.length}</div>
      ${fee ? `<div class="kv"><span>Balance</span><b style="color:${fee - paid > 0 ? 'var(--danger)' : 'var(--ok)'}">${fee - paid > 0 ? esc(money(fee - paid)) + ' of ' + esc(money(fee)) : 'Paid in full'}</b></div>` : ''}
    </article>`;
  }).join('')}</div>` : emptyHtml(vids.length ? 'No projects match these filters.' : 'No video projects yet.', vids.length ? '' : 'video', 'Add your first project')}
  <div class="grid section">
    ${recurCard('video', 12)}
    <section class="card span-7"><div class="card-h"><h2>Video income and expenses, ${yr}</h2><div class="acts">${addBtn('tx', 'Income', { type: 'income', source: 'video', category: 'Client payment' }, 'btn sm')}${addBtn('tx', 'Expense', { type: 'expense', source: 'video', category: 'Software' }, 'btn sm')}</div></div>
      ${vTx.length ? txRows(vTx, 8) : emptyHtml('Payments you record on a project show up here.')}</section>
    <section class="card span-5"><div class="card-h"><h2>Creative and professional goals</h2><div class="acts">${addBtn('goal', 'Goal', { cat: 'video' }, 'btn sm')}</div></div>
      ${goalList(byKind('goal').filter(g => g.cat === 'video')) || emptyHtml('Track goals like “Learn color grading in Resolve”.')}</section>
  </div>`;
}

/* ============ Views: Finance ============ */
function viewFinance() {
  const mk = V.fin.month, ms = monthSummary(mk), t = today();
  const occ = billOccurrences(mk + '-01', monthEnd(mk + '-01'));
  const billsTotal = sum(occ, o => num(o.bill.amount)), billsPaid = sum(occ.filter(o => o.paid), o => num(o.bill.amount));
  const months = [...Array(6)].map((_, i) => addMonths(mk, i - 5));
  const sums = months.map(monthSummary);
  const exp = ms.tx.filter(x => x.type !== 'income');
  const byCat = {}; for (const x of exp) { const c = x.category || 'Other'; byCat[c] = (byCat[c] || 0) + num(x.amount); }
  const bySrc = OPT.txSource.map(([k, l]) => [l, sum(ms.tx.filter(x => x.type === 'income' && x.source === k), x => num(x.amount)), `var(--c-${SOURCE_CAT[k]})`]).filter(r => r[1] > 0);
  const budgets = byKind('budget').sort((a, b) => (a.category || '').localeCompare(b.category || ''));
  const spentFor = c => sum(exp.filter(x => (x.category || '').toLowerCase() === (c || '').toLowerCase()), x => num(x.amount));
  const budgetTotal = sum(budgets, b => num(b.limit)), budgetSpent = sum(budgets, b => spentFor(b.category));
  const f = V.f.tx;
  let txl = byKind('tx').filter(x => x.date && x.date.startsWith(mk) && match(f.q, x.note, x.category, lbl(OPT.txSource, x.source)));
  if (f.type) txl = txl.filter(x => (x.type || 'expense') === f.type);
  if (f.source) txl = txl.filter(x => x.source === f.source);
  const sorters = { 'date-desc': (a, b) => b.date.localeCompare(a.date), date: (a, b) => a.date.localeCompare(b.date), amount: (a, b) => num(b.amount) - num(a.amount) };
  txl.sort(sorters[f.sort] || sorters['date-desc']);
  return `
  <div class="ph"><div><h1>${sw('finance')}Bills and finance</h1><p>${esc(fmtMonth(mk))}</p></div>
    <div class="acts">
      <div class="seg"><button data-act="finNav" data-d="-1" aria-label="Previous month">${icon('left')}</button><button data-act="finNav" data-d="0">This month</button><button data-act="finNav" data-d="1" aria-label="Next month">${icon('right')}</button></div>
      ${addBtn('tx', 'Transaction', { date: mk === t.slice(0, 7) ? t : mk + '-01' }, 'btn')}${addBtn('bill', 'Bill', null, 'btn primary')}
    </div></div>
  ${statsHtml([
    [money(ms.income, true), 'Income', 'pos'],
    [money(ms.expense, true), 'Expenses'],
    [money(ms.net, true), 'Net', ms.net < 0 ? 'neg' : 'pos'],
    [`${occ.filter(o => o.paid).length}/${occ.length}`, 'Bills paid'],
    [money(billsTotal - billsPaid, true), 'Bills left to pay', billsTotal - billsPaid > 0 ? 'neg' : ''],
  ])}
  <div class="grid">
    <section class="card span-7"><div class="card-h"><h2>Bills and recurring payments</h2><div class="acts">${addBtn('bill', 'Bill', null, 'btn sm')}</div></div>
      ${occ.length ? `<div class="rows">${occ.map(o => `<div class="row ${o.paid ? 'done' : ''}"><input type="checkbox" data-act="billPaid" data-id="${o.bill.id}" data-key="${o.key}" ${o.paid ? 'checked' : ''} aria-label="Mark ${esc(o.bill.name)} paid">
        <div class="grow click" data-act="edit" data-id="${o.bill.id}" style="cursor:pointer"><div class="t">${esc(o.bill.name)}</div><div class="s">${esc(lbl(OPT.billFreq, o.bill.freq || 'monthly'))}, ${esc(o.bill.category || 'Bill')}${o.bill.autopay ? ', autopay' : ''}${o.paid ? ', paid ' + esc(fmtDate(o.bill.paid[o.key])) : ''}</div></div>
        <b style="font-size:14px">${esc(money(num(o.bill.amount)))}</b>${dueTag(o.date, o.paid)}</div>`).join('')}</div>` : emptyHtml(byKind('bill').length ? 'No bills due this month.' : 'Add rent, utilities, subscriptions and other recurring bills. Ticking one as paid records the expense for you.', byKind('bill').length ? '' : 'bill', 'Add bill')}
    </section>
    <section class="card span-5"><div class="card-h"><h2>Monthly budget plan</h2><div class="acts">${addBtn('budget', 'Budget line', null, 'btn sm')}</div></div>
      ${budgets.length ? budgets.map(b => { const sp = spentFor(b.category), lim = num(b.limit); return `<div style="padding:7px 0;cursor:pointer" data-act="edit" data-id="${b.id}"><div class="kv" style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(b.category)}</span><span style="color:${sp > lim ? 'var(--danger)' : 'var(--muted)'}">${esc(money(sp, true))} of ${esc(money(lim, true))}</span></div>${barHtml(pct(sp, lim), 'var(--c-finance)', sp > lim)}</div>`; }).join('') + `<p class="note" style="margin:10px 0 0">Total: ${esc(money(budgetSpent, true))} spent of ${esc(money(budgetTotal, true))} planned. Expenses count toward a line when their category matches.</p>` : emptyHtml('Set a monthly limit for categories like Food, Transport or Equipment.')}
    </section>
    <section class="card span-7"><div class="card-h"><h2>Income and expenses, last 6 months</h2></div>
      ${barChart(months.map(fmtMonthS), [{ name: 'Income', color: 'var(--c-finance)', values: sums.map(s => s.income) }, { name: 'Expenses', color: 'var(--c-design)', values: sums.map(s => s.expense) }], { cur: 5, fmt: v => money(v, true), label: 'Income and expenses for six months' })}
    </section>
    <section class="card span-5"><div class="card-h"><h2>Where it came from and went</h2></div>
      ${bySrc.length ? `<p class="note" style="margin:0 0 4px">Income by source</p>${hbars(bySrc, 'var(--c-finance)', v => money(v, true))}` : ''}
      ${Object.keys(byCat).length ? `<p class="note" style="margin:12px 0 4px">Expenses by category</p>${hbars(Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 7), 'var(--c-personal)', v => money(v, true))}` : ''}
      ${!bySrc.length && !Object.keys(byCat).length ? emptyHtml('Record income and expenses to see the breakdown.') : ''}
    </section>
    <section class="card span-12"><div class="card-h"><h2>Transactions</h2><div class="acts"><button class="btn sm" data-act="exportCsv">${icon('down')}CSV</button>${addBtn('tx', 'Transaction', { date: mk === t.slice(0, 7) ? t : mk + '-01' }, 'btn sm')}</div></div>
      ${filterBar('tx', [
        { k: 'q', search: true, ph: 'Filter transactions' },
        { k: 'type', label: 'Type', opts: [['', 'Income and expenses'], ['income', 'Income'], ['expense', 'Expenses']] },
        { k: 'source', label: 'Source', opts: [['', 'All sources'], ...OPT.txSource] },
        { k: 'sort', label: 'Sort', opts: [['date-desc', 'Newest first'], ['date', 'Oldest first'], ['amount', 'Largest amount']] },
      ])}
      ${txl.length ? txRows(txl) : emptyHtml('No transactions this month.')}
    </section>
  </div>`;
}

/* ============ Views: Running ============ */
function viewRun() {
  const t = today(), mon = startOfWeek(t), mk = t.slice(0, 7), st = settings();
  const rs = runs();
  const kmW = kmBetween(mon, addDays(mon, 6)), kmM = kmBetween(mk + '-01', monthEnd(t));
  const monthRuns = rs.filter(r => r.date.startsWith(mk));
  const timed = monthRuns.filter(r => parseDur(r.duration) > 0);
  const avgPace = timed.length ? sum(timed, r => parseDur(r.duration)) / sum(timed, r => num(r.distance)) : 0;
  const weeks = [...Array(12)].map((_, i) => addDays(mon, (i - 11) * 7));
  const wkKm = weeks.map(w => kmBetween(w, addDays(w, 6)));
  const active8 = wkKm.slice(4).filter(v => v > 0).length;
  const paceRuns = rs.filter(r => parseDur(r.duration) > 0 && num(r.distance) >= 2).slice(0, 15).reverse();
  const pr = personalRecords();
  const plans = byKind('plan').sort((a, b) => (a.raceDate || '').localeCompare(b.raceDate || ''));
  const f = V.f.runs;
  let log = rs.filter(r => match(f.q, r.type, r.notes, r.date));
  if (f.type) log = log.filter(r => r.type === f.type);
  const sorters = { 'date-desc': (a, b) => b.date.localeCompare(a.date), dist: (a, b) => num(b.distance) - num(a.distance), pace: (a, b) => (parseDur(a.duration) / num(a.distance) || 1e9) - (parseDur(b.duration) / num(b.distance) || 1e9) };
  log.sort(sorters[f.sort] || sorters['date-desc']);
  const goalKm = num(st.weekGoalKm);
  return `
  <div class="ph"><div><h1>${sw('run')}Running and workouts</h1><p>Schedules, training plans, distances, pace and records.</p></div>
    <div class="acts"><button class="btn" data-act="garmin">${icon('run')}${garminOn() ? 'Garmin sync' : 'Connect Garmin'}</button><button class="btn" data-act="newPlan">${icon('cal')}Training plan</button>${addBtn('run', 'Log run', { date: t }, 'btn primary')}</div></div>
  ${statsHtml([
    [`${round1(kmW)} km`, goalKm ? `This week, goal ${goalKm} km` : 'This week'],
    [`${round1(kmM)} km`, 'This month'],
    [monthRuns.length, 'Workouts this month'],
    [avgPace ? fmtDur(avgPace) : '–', 'Average pace this month, per km'],
    [`${active8}/8`, 'Active weeks, last 8'],
  ])}
  ${garminBar()}
  <div class="grid">
    <section class="card span-7"><div class="card-h"><h2>This week</h2><span class="note" style="margin-left:auto">Dashed runs are planned. Tap one to log it.</span></div>
      ${weekStrip()}
      ${goalKm ? `<div style="margin-top:12px">${barHtml(pct(kmW, goalKm), 'var(--c-run)')}</div>` : ''}</section>
    <section class="card span-5"><div class="card-h"><h2>Personal records</h2></div>
      <div class="pr">${pr.list.map(p => `<div><b>${p.t ? esc(fmtDur(p.t)) : '–'}</b><span>${esc(p.name)}${p.date ? ', ' + esc(fmtDate(p.date)) : ''}</span></div>`).join('')}
      <div><b>${pr.longest ? round1(num(pr.longest.distance)) + ' km' : '–'}</b><span>Longest run</span></div></div>
      <p class="note" style="margin:10px 0 0">Best efforts are worked out from your logged runs at or above each distance.</p></section>
    <section class="card span-7"><div class="card-h"><h2>Weekly distance, last 12 weeks</h2></div>
      ${barChart(weeks.map(w => fmtDate(w)), [{ name: 'Distance', color: 'var(--c-run)', values: wkKm }], { cur: 11, fmt: v => round1(v) + ' km', label: 'Kilometers per week' })}</section>
    <section class="card span-5"><div class="card-h"><h2>Pace trend</h2><span class="note" style="margin-left:auto">Higher is faster</span></div>
      ${paceRuns.length >= 2 ? lineChart(paceRuns.map(r => ({ l: fmtDate(r.date), v: parseDur(r.duration) / num(r.distance) })), 'var(--c-run)', v => fmtDur(v) + ' /km', true) : emptyHtml('Log at least two runs with a time to see your pace trend.')}</section>
    <section class="card span-7"><div class="card-h"><h2>Plan vs what you ran</h2></div>${planVsActual()}</section>
    <section class="card span-5"><div class="card-h"><h2>Heart rate trend</h2><span class="note" style="margin-left:auto">Average per run</span></div>${hrTrend()}</section>
    <section class="card span-12"><div class="card-h"><h2>Training plans</h2><div class="acts"><button class="btn sm" data-act="newPlan">${icon('plus')}New plan</button></div></div>
      ${plans.length ? plans.map(p => {
        const ss = p.sessions || [], done = ss.filter(s => s.done && !s.skipped).length, skipped = ss.filter(s => s.skipped).length;
        const next = ss.filter(s => !s.done && s.date >= t).slice(0, 5);
        const missed = ss.filter(s => !s.done && s.date < t).length;
        const toGo = daysBetween(t, p.raceDate);
        return `<div style="padding:12px 0;border-top:1px solid var(--line-2)">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:15px">${esc(p.title)}</b><span class="chip cat" style="--cc:var(--c-run)">${esc(DIST_NAME[p.dist] || p.dist + ' km')}</span><span class="note">Race ${esc(fmtDateY(p.raceDate))}${toGo >= 0 ? `, ${toGo} days to go` : ''}</span>
            <span style="margin-left:auto" class="note">${done} of ${ss.length} sessions done${skipped ? `, ${skipped} skipped` : ''}${missed ? `, ${missed} missed` : ''}</span><button class="btn sm ghost danger" data-act="delPlan" data-id="${p.id}">${icon('trash')}Delete</button></div>
          <div style="margin:8px 0">${barHtml(pct(done, ss.length), 'var(--c-run)')}</div>
          ${next.length ? `<div class="rows">${next.map(s => `<div class="row"><span class="when" style="width:84px">${esc(relDay(s.date))}</span><div class="grow"><div class="t">${esc(s.type)}, ${s.distance} km</div></div><button class="btn sm" data-act="logSession" data-id="${p.id}" data-sid="${s.id}">${icon('check')}Log</button><button class="btn sm ghost" data-act="skipSession" data-id="${p.id}" data-sid="${s.id}">Skip</button></div>`).join('')}</div>` : '<p class="note">No upcoming sessions.</p>'}
        </div>`;
      }).join('') : emptyHtml('Create a 5K, 10K, half-marathon or marathon plan. It builds week by week to race day and fills your calendar.')}
    </section>
    <section class="card span-12"><div class="card-h"><h2>Run and workout log</h2><div class="acts">${addBtn('run', 'Log run', { date: t }, 'btn sm')}</div></div>
      ${filterBar('runs', [
        { k: 'q', search: true, ph: 'Filter runs' },
        { k: 'type', label: 'Type', opts: [['', 'All workouts'], ...optList(OPT.runType)] },

function viewTasks() {

  if (f.status === 'open') list = list.filter(x => x.status !== 'done');
  else if (f.status) list = list.filter(x => x.status === f.status);
  if (f.pri) list = list.filter(x => x.priority === f.pri);
  const sorters = { due: sortTasks, priority: (a, b) => (PRI[a.priority] ?? 1) - (PRI[b.priority] ?? 1) || (a.due || '9999').localeCompare(b.due || '9999'), created: (a, b) => (b.createdAt || 0) - (a.createdAt || 0), title: (a, b) => a.title.localeCompare(b.title) };

/* ============ Toast ============ */
function toast(msg, undo) {
  const el = document.createElement('div');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { undo(); el.remove(); toast('Restored'); };
  const box = $('#toast'); while (box.children.length > 2) box.firstChild.remove();
  box.appendChild(el);
  setTimeout(() => el.remove(), undo ? 6000 : 3200);
}

function parseCsv(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    } else if (c === '"') q = true;

}

const activeHabits = () => byKind('habit').filter(h => h.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0) || a.title.localeCompare(b.title));

}

/* --- Important dates --- */
function occNext(o, from) {
  from = from || today();
  if (!o.date) return null;
  const md = o.date.slice(5);
  const mk = y => { let d = `${y}-${md}`; if (md === '02-29' && new Date(y, 1, 29).getMonth() !== 1) d = `${y}-02-28`; return d; };
  let d = mk(yearOf(from)); if (d < from) d = mk(yearOf(from) + 1);
  return d;
}
const occYears = (o, d) => o.noYear || !o.date ? 0 : yearOf(d) - yearOf(o.date);
function occTitle(o, d) { const y = occYears(o, d); return `${o.name}${y > 0 ? ` (${o.type === 'Birthday' ? 'turns ' + y : y + (y === 1 ? ' year' : ' years')})` : ''}`; }
function viewDates() {

      <div class="datebox"><b>${parseYmd(d).getDate()}</b><span>${esc(fmtMonthS(d.slice(0, 7)))}</span></div>
      <div class="grow"><div class="t">${esc(occTitle(o, d))}</div><div class="s">${esc(o.type || 'Date')}${o.ideas ? ', gift ideas: ' + esc(o.ideas) : ''}</div></div>
      <span class="when ${n <= (num(o.remind) || 7) ? 'soon' : ''}">${n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days'}</span></div>`; }).join('')}</div></section>`

/* --- Goals with auto-tracking --- */
function goalCur(g) {
  const base = num(g.current);
  if (!g.track) return base;
  const since = g.since || (g.createdAt ? ymd(new Date(g.createdAt)) : '0000-01-01');
  if (g.track === 'savings') { const cat = (g.trackCat || 'Savings').toLowerCase(); return base + sum(byKind('tx').filter(x => x.type !== 'income' && (x.category || '').toLowerCase() === cat && x.date >= since), x => num(x.amount)); }
  if (g.track === 'income') return base + sum(byKind('tx').filter(x => x.type === 'income' && x.date >= since), x => num(x.amount));
  if (g.track === 'runkm') return base + sum(runs().filter(r => r.date >= since), r => num(r.distance));
  return base;
}

/* --- Running: plan vs actual, heart rate trend --- */
function planVsActual() {
  const t = today(), plans = byKind('plan').filter(p => (p.sessions || []).length).sort((a, b) => (a.raceDate || '').localeCompare(b.raceDate || ''));
  const p = plans.find(x => x.raceDate >= t) || plans[plans.length - 1];
  if (!p) return emptyHtml('Create a training plan to compare what you planned with what you actually ran.');
  const ss = [...p.sessions].sort((a, b) => a.date.localeCompare(b.date));
  const first = startOfWeek(ss[0].date), cur = startOfWeek(t);
  let start = addDays(cur, -35); if (start < first) start = first;
  const weeks = [...Array(8)].map((_, i) => addDays(start, 7 * i));
  const planned = weeks.map(w => sum(ss.filter(s => s.date >= w && s.date <= addDays(w, 6)), s => num(s.distance)));
  const actual = weeks.map(w => w > t ? 0 : kmBetween(w, addDays(w, 6)));
  const past = ss.filter(s => s.date < t), done = past.filter(s => s.done && !s.skipped).length;
  return `<p class="note" style="margin:0 0 8px">${esc(p.title)}: ${done} of ${past.length} past session${past.length === 1 ? '' : 's'} done${past.length ? ` (${Math.round(done / past.length * 100)}%)` : ''}. Dashed bars are planned.</p>` +
    barChart(weeks.map(w => fmtDate(w)), [{ name: 'Planned', color: 'var(--c-run)', values: planned, plan: true }, { name: 'Ran', color: 'var(--c-run)', values: actual }], { cur: weeks.indexOf(cur), fmt: v => round1(v) + ' km', label: 'Planned and actual kilometers per week' });
}
function hrTrend() {
  const rs = runs().filter(r => num(r.avgHr) > 0).slice(0, 15).reverse();
  if (rs.length < 2) return emptyHtml('Heart rate shows here once your Garmin runs sync, or when you add it to a run.');
  const t = today(), easy = r => /easy|recovery|long/i.test(r.type || '') && parseDur(r.duration) > 0 && num(r.distance) > 0 && num(r.avgHr) > 0;
  const a = runs().filter(r => easy(r) && r.date > addDays(t, -28)), b = runs().filter(r => easy(r) && r.date <= addDays(t, -28) && r.date > addDays(t, -56));
  const avg = l => ({ pace: sum(l, r => parseDur(r.duration)) / sum(l, r => num(r.distance)), hr: Math.round(sum(l, r => num(r.avgHr)) / l.length) });
  let note = '';
  if (a.length && b.length) {
    const A = avg(a), B = avg(b);
    note = `Easy runs, last 4 weeks: ${fmtDur(A.pace)} /km at ${A.hr} bpm. The 4 weeks before: ${fmtDur(B.pace)} /km at ${B.hr} bpm. ` + (A.pace < B.pace && A.hr <= B.hr ? 'Faster at the same or lower heart rate, so your fitness is improving.' : A.hr < B.hr && A.pace <= B.pace * 1.02 ? 'About the same pace at a lower heart rate, so your fitness is improving.' : 'Keep most runs truly easy and this should improve over the coming weeks.');
  } else if (a.length) { const A = avg(a); note = `Easy runs, last 4 weeks: ${fmtDur(A.pace)} /km at ${A.hr} bpm on average.`; }
  return lineChart(rs.map(r => ({ l: fmtDate(r.date), v: num(r.avgHr) })), 'var(--danger)', v => Math.round(v) + ' bpm', false) + (note ? `<p class="note" style="margin:10px 0 0">${esc(note)}</p>` : '');
}

    const t = get(a.dataset.id); if (!t) return;
    const c = clone(t);
    if (c.status === 'done') { c.status = 'todo'; delete c.completedAt; } else { c.status = 'done'; c.completedAt = Date.now(); }
    upsert(c);
    if (c.status === 'done') toast('Task completed', () => { const u = clone(get(c.id)); u.status = 'todo'; delete u.completedAt; upsert(u); });
  },
  billPaid: a => toggleBillPaid(a.dataset.id, a.dataset.key),
  designMove: a => {
    const d = get(a.dataset.id); if (!d) return;
    const c = clone(d); c.status = a.value;
    if (c.status === 'done' && (c.steps || []).length) c.steps.forEach(s => { if (!s.done) { s.done = true; s.doneOn = today(); } });
    if (c.status === 'done') { c.completedOn = c.completedOn || today(); c.progress = 100; } else delete c.completedOn;
    upsert(c); toast(`Moved to ${lbl(OPT.designStatus, c.status)}`);
  },
  prefToggle: a => { const s2 = clone(settings()); s2[a.dataset.k] = a.dataset.invert ? !a.checked : a.checked; upsert(s2); toast('Preference saved'); },
  prefSelect: a => { const s = clone(settings()); s[a.dataset.k] = a.value; upsert(s); toast('Preference saved'); },
};

document.addEventListener('click', e => {
  if (!e.target.closest('.pop, [data-act="toggleNotif"], [data-act="quickAdd"], .search')) closePops();
  const a = e.target.closest('[data-act]');
  if (e.target.closest('a[target="_blank"]')) return;
  if (!a || a.closest('#mform')) return;
  if (a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type === 'checkbox')) return; // handled on change
  const fn = ACT[a.dataset.act];
  if (fn) { if (a.tagName === 'A') e.preventDefault(); if (a.closest('#quickPop')) closePops(); fn(a, e); }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.closest('#mform') && CHANGE[a.dataset.act]) { CHANGE[a.dataset.act](a); return; }
  const f = e.target.dataset && e.target.dataset.f;
  if (f && e.target.tagName === 'SELECT') { const [k, field] = f.split('.'); V.f[k][field] = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f && e.target.tagName === 'INPUT') { const [k, field] = f.split('.'); V.f[k][field] = e.target.value; render(); }
  if (e.target.id === 'gsearch') { closePops('searchPop'); renderSearch(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePops(); document.body.classList.remove('nav-open'); }
  if (e.key === '/' && !e.target.closest('input,textarea,select,dialog')) { e.preventDefault(); $('#gsearch').focus(); }
  if (e.key === 'Enter' && e.target.id === 'payAmt') { e.preventDefault(); $('[data-pay]').click(); }
});
$('#gsearch').addEventListener('focus', () => { if ($('#gsearch').value.trim()) renderSearch(); });
window.addEventListener('hashchange', () => { closePops(); document.body.classList.remove('nav-open'); $('#gsearch').value = ''; render(); window.scrollTo(0, 0); $('#view').focus({ preventScroll: true }); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme((() => { try { return localStorage.getItem(LS_THEME) || 'system'; } catch { return 'system'; } })()));
// Keep "today" fresh if the page stays open overnight
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } else if (route() === 'dashboard' && !$('#modal').open) render(); }, 60000);

/* Register PWA offline shell. Firestore live data always uses Firebase, not GitHub. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
/* ============ Start ============ */
(function start() {
  try { applyTheme(localStorage.getItem(LS_THEME) || 'system'); } catch { applyTheme('system'); }
  try {
    const g = JSON.parse(localStorage.getItem(LS_GCAL) || 'null');
    if (g && g.on && Array.isArray(g.events)) { S.gcal = g.events; S.gcalAt = g.at; S.gcalMsg = `Showing ${g.events.length} Google Calendar events from your last sync.`; }
  } catch {}
  try { const c = JSON.parse(localStorage.getItem(LS_SHEET) || 'null'); if (c && Array.isArray(c.rows)) { S.sheet.rows = c.rows; S.sheet.at = c.at; } } catch {}
  setInterval(() => { if (settings().sheet && document.visibilityState === 'visible') syncSheet(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && settings().sheet && (!S.sheet.at || Date.now() - S.sheet.at > 2 * 60000)) syncSheet(); });
  initStore();
  if (S.gcal.length && (!S.gcalAt || Date.now() - S.gcalAt > 30 * 60000)) setTimeout(gcalSync, 1500);
})();
</script>
</body>
